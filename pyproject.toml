[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mineral-assay-analytics"
version = "0.1.0"
description = "Titration, XRF and flotation assay calculations"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mineral-assay = "mineral_assay.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
